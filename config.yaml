search:
  keywords:
  - java
  - backend
  - spring boot
  - aws
  - kafka
  location: ''
  remote_only: false
  countries:
  - in
  strict_country_filter: true
  keep_remote_worldwide: true
  keep_unknown_location: true
  years_of_experience: 4.0
  keep_unknown_experience: true
  experience_tolerance: 2.0
  max_results_per_source: 60
  posted_within_days: 15
  max_pages: 4
resume:
  path: ./data/resume.pdf
  text_fallback_path: ./data/resume.txt
sources:
  jsearch:
    enabled: true
    host: jsearch.p.rapidapi.com
    search_path: search-v2
    job_details_path: job-details
    api_key_env: RAPIDAPI_KEY
    max_query_variants: 1
    exclude_job_publishers:
    - BeBee
    - Shine
    - JobLeads
    - Jooble
    - Neuvoo
    - WhatJobs
    - Talent.com
  remotive:
    enabled: true
  arbeitnow:
    enabled: true
  company_boards:
    enabled: true
    keyword_filter: true
    include_descriptions: true
    keyword_match_field: description
